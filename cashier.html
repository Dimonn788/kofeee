<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Касса — Кофе &amp; Точка</title>
<style>
  /*
    Страница специально не использует веб-шрифты, размытие фона, длинные
    transition и тяжёлые тени — планшеты в кассе старые и слабые (Chrome 90),
    каждый лишний слой перерисовки заметно тормозит на сенсорном вводе.
  */
  :root{
    --brown:#2C1810; --brown-soft:#4A2E1E; --beige:#F5E6D3; --beige-light:#FBF4EA;
    --caramel:#E67A2E; --caramel-dark:#C9631E; --line:#E4D6C3; --green:#3B7A3A; --red:#B33A2E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0; font-family:-apple-system, Roboto, Segoe UI, Arial, sans-serif; background:var(--beige-light); color:var(--brown); user-select:none; -webkit-tap-highlight-color:transparent;}
  h1,h2{margin:0;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  input,select{font-family:inherit;}

  /* ---------- SETUP ---------- */
  #setupScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .setup-card{background:#fff; border:1px solid var(--line); border-radius:14px; padding:32px; width:100%; max-width:360px;}
  .setup-card h1{font-size:22px; margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:14px; font-weight:600; color:var(--brown-soft); margin-bottom:8px;}
  .field input, .field select{width:100%; padding:14px; border-radius:8px; border:1px solid var(--line); font-size:16px; background:#fff;}
  .btn{background:var(--caramel); color:#fff; padding:16px; border-radius:8px; font-weight:700; font-size:16px; width:100%;}
  .setup-error{color:var(--red); font-size:14px; margin-bottom:12px; display:none;}
  .setup-error.show{display:block;}

  /* ---------- POS LAYOUT ---------- */
  #posScreen{display:none; height:100vh; flex-direction:column;}
  #posScreen.visible{display:flex;}
  .pos-top{background:var(--brown); color:var(--beige); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;}
  .pos-top .loc-name{font-weight:700; font-size:16px;}
  .pos-top .loc-name .sub{display:block; font-size:12px; font-weight:400; opacity:.7;}
  .mode-switch{display:flex; background:var(--brown-soft); border-radius:8px; padding:3px;}
  .mode-switch button{padding:10px 18px; border-radius:6px; font-weight:700; font-size:14px; color:rgba(245,230,211,.6);}
  .mode-switch button.active{background:var(--caramel); color:#fff;}
  .top-logout{font-size:13px; color:rgba(245,230,211,.7); font-weight:600; padding:8px 10px;}

  .pos-body{flex-grow:1; display:flex; overflow:hidden;}
  .menu-pane{flex:1 1 62%; display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--line);}
  .cart-pane{flex:0 0 38%; max-width:360px; display:flex; flex-direction:column; background:#fff;}

  .cat-tabs{display:flex; gap:6px; padding:10px; background:var(--beige); flex-shrink:0; overflow-x:auto;}
  .cat-tabs button{padding:12px 18px; border-radius:8px; font-weight:700; font-size:14px; color:var(--brown-soft); background:#fff; flex-shrink:0;}
  .cat-tabs button.active{background:var(--brown); color:var(--beige);}

  .item-grid{flex-grow:1; overflow-y:auto; padding:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-content:start;}
  .item-tile{background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; text-align:left; min-height:120px; display:flex; flex-direction:column;}
  .item-tile .tile-icon{color:var(--caramel-dark); margin-bottom:8px;}
  .item-tile .tile-name{font-weight:700; font-size:15px; line-height:1.25;}
  .item-tile .tile-price{margin-top:auto; font-weight:700; font-size:15px; color:var(--brown-soft); padding-top:8px;}
  .item-tile.sold-out{opacity:.45;}
  .item-tile.sold-out .tile-price{color:var(--red);}
  .item-tile.mode-stock{border-color:var(--caramel);}
  .item-tile.mode-stock.sold-out{background:#fbeceA; border-color:var(--red);}
  .item-tile.mode-stock.in-stock{background:#eef6ee; border-color:var(--green);}
  .item-tile .stock-tag{margin-top:auto; padding-top:8px; font-weight:700; font-size:13px;}
  .item-tile.mode-stock.sold-out .stock-tag{color:var(--red);}
  .item-tile.mode-stock.in-stock .stock-tag{color:var(--green);}

  .cart-pane-head{padding:14px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:16px; flex-shrink:0;}
  .cart-lines{flex-grow:1; overflow-y:auto; padding:10px 12px;}
  .cart-empty{color:var(--brown-soft); font-size:14px; text-align:center; padding:30px 10px;}
  .cart-line{display:flex; align-items:center; gap:10px; padding:10px 6px; border-bottom:1px solid var(--line);}
  .cart-line .cl-name{flex-grow:1; font-size:14px; font-weight:600;}
  .cart-line .cl-price{font-size:13px; color:var(--brown-soft);}
  .qty-ctl{display:flex; align-items:center; gap:6px;}
  .qty-btn{width:34px; height:34px; border-radius:8px; background:var(--beige); font-weight:700; font-size:16px;}
  .qty-val{min-width:16px; text-align:center; font-weight:700;}

  .cart-pane-foot{padding:14px 16px; border-top:1px solid var(--line); flex-shrink:0;}
  .cart-total-row{display:flex; justify-content:space-between; font-size:16px; font-weight:700; margin-bottom:12px;}
  .clear-btn{font-size:13px; color:var(--brown-soft); font-weight:600; width:100%; text-align:center; padding:8px 0 2px;}

  /* ---------- CHECKOUT MODAL ---------- */
  .overlay{position:fixed; inset:0; background:rgba(32,19,12,.5); display:none; align-items:center; justify-content:center; padding:16px; z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:#fff; border-radius:12px; padding:24px; width:100%; max-width:380px;}
  .modal h2{font-size:18px; margin-bottom:16px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .btn-secondary{background:var(--beige); color:var(--brown);}

  @media (max-width:820px){
    .pos-body{flex-direction:column;}
    .menu-pane{border-right:none; border-bottom:1px solid var(--line); flex:1 1 55%;}
    .cart-pane{flex:1 1 45%; max-width:none;}
    .item-grid{grid-template-columns:repeat(2,1fr);}
  }
</style>
</head>
<body>

<div id="setupScreen">
  <div class="setup-card">
    <h1>Вход на кассу</h1>
    <div class="setup-error" id="setupError">Проверьте кофейню, логин и пароль</div>
    <div class="field"><label for="setupLocation">Кофейня (эта касса)</label><select id="setupLocation"><option value="">Загрузка…</option></select></div>
    <div class="field"><label for="setupUser">Логин</label><input type="text" id="setupUser"></div>
    <div class="field"><label for="setupPass">Пароль</label><input type="password" id="setupPass"></div>
    <button class="btn" id="setupLoginBtn">Начать смену</button>
  </div>
</div>

<div id="posScreen">
  <div class="pos-top">
    <div class="loc-name" id="posLocName">—<span class="sub">касса</span></div>
    <div class="mode-switch">
      <button class="active" data-mode="order">Заказ</button>
      <button data-mode="stock">Наличие</button>
    </div>
    <button class="top-logout" id="posLogoutBtn">Завершить смену</button>
  </div>
  <div class="pos-body">
    <div class="menu-pane">
      <div class="cat-tabs" id="catTabs"></div>
      <div class="item-grid" id="itemGrid"></div>
    </div>
    <div class="cart-pane">
      <div class="cart-pane-head">Текущий заказ</div>
      <div class="cart-lines" id="cartLines"></div>
      <div class="cart-pane-foot">
        <div class="cart-total-row"><span>Итого</span><span id="cartTotal">0 ₽</span></div>
        <button class="btn" id="checkoutBtn">Оформить заказ</button>
        <button class="clear-btn" id="clearCartBtn">Очистить заказ</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="checkoutOverlay">
  <div class="modal">
    <h2>Оформление заказа</h2>
    <div class="field"><label for="coName">Имя гостя (необязательно)</label><input type="text" id="coName" placeholder="Гость"></div>
    <div class="field"><label for="coComment">Комментарий (необязательно)</label><input type="text" id="coComment" placeholder="Например: без сахара"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="coCancelBtn" style="flex:1;">Отмена</button>
      <button class="btn" id="coConfirmBtn" style="flex:2;">Подтвердить</button>
    </div>
  </div>
</div>

<script src="/shared/icons.js"></script>
<script>
(function(){
  'use strict';
  var token = localStorage.getItem('cashierToken');
  var locationId = localStorage.getItem('cashierLocationId');
  var locationName = localStorage.getItem('cashierLocationName');
  var MENU = { categories: [], items: [] };
  var LOCATIONS = [];
  var activeCat = null;
  var mode = 'order';
  var cart = {}; // не сохраняется в localStorage: заказ у кассы — разовая операция за смену

  function authHeaders(){ return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

  fetch('/api/locations').then(function(r){ return r.json(); }).then(function(data){
    LOCATIONS = data.locations;
    var sel = document.getElementById('setupLocation');
    sel.innerHTML = '';
    LOCATIONS.forEach(function(loc){
      var opt = document.createElement('option');
      opt.value = loc.id; opt.textContent = loc.name;
      sel.appendChild(opt);
    });
    if(locationId) sel.value = locationId;
  });

  document.getElementById('setupLoginBtn').addEventListener('click', async function(){
    var loc = document.getElementById('setupLocation').value;
    var u = document.getElementById('setupUser').value.trim();
    var p = document.getElementById('setupPass').value;
    var errEl = document.getElementById('setupError');
    errEl.classList.remove('show');
    if(!loc || !u || !p){ errEl.classList.add('show'); return; }
    try{
      var res = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username:u, password:p}) });
      var data = await res.json();
      if(!res.ok || (data.role !== 'cashier' && data.role !== 'admin')){ errEl.classList.add('show'); return; }
      token = data.token;
      locationId = loc;
      locationName = LOCATIONS.find(function(l){ return l.id === loc; }).name;
      localStorage.setItem('cashierToken', token);
      localStorage.setItem('cashierLocationId', locationId);
      localStorage.setItem('cashierLocationName', locationName);
      enterPos();
    }catch(e){ errEl.classList.add('show'); }
  });

  document.getElementById('posLogoutBtn').addEventListener('click', async function(){
    if(!confirm('Завершить смену и выйти?')) return;
    try{ await fetch('/api/logout', { method:'POST', headers: authHeaders() }); }catch(e){}
    localStorage.removeItem('cashierToken');
    token = null;
    document.getElementById('posScreen').classList.remove('visible');
    document.getElementById('setupScreen').style.display = 'flex';
  });

  async function enterPos(){
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('posScreen').classList.add('visible');
    document.getElementById('posLocName').innerHTML = locationName + '<span class="sub">касса</span>';
    await loadMenu();
  }

  async function loadMenu(){
    var res = await fetch('/api/menu');
    var data = await res.json();
    MENU = data;
    if(!activeCat) activeCat = MENU.categories[0].id;
    renderCatTabs();
    renderItemGrid();
  }

  function renderCatTabs(){
    var el = document.getElementById('catTabs');
    el.innerHTML = '';
    MENU.categories.forEach(function(cat){
      var btn = document.createElement('button');
      btn.className = cat.id === activeCat ? 'active' : '';
      btn.textContent = cat.label;
      btn.addEventListener('click', function(){ activeCat = cat.id; renderCatTabs(); renderItemGrid(); });
      el.appendChild(btn);
    });
  }

  function renderItemGrid(){
    var el = document.getElementById('itemGrid');
    el.innerHTML = '';
    MENU.items.filter(function(i){ return i.category === activeCat; }).forEach(function(item){
      var tile = document.createElement('button');
      var stockClass = mode === 'stock' ? ' mode-stock ' + (item.soldOut ? 'sold-out' : 'in-stock') : (item.soldOut ? ' sold-out' : '');
      tile.className = 'item-tile' + stockClass;
      tile.innerHTML =
        '<div class="tile-icon">' + window.renderMenuIcon(item.icon, 26) + '</div>' +
        '<div class="tile-name">' + item.name + '</div>' +
        (mode === 'stock'
          ? '<div class="stock-tag">' + (item.soldOut ? 'Нет в наличии — нажмите' : 'В наличии — нажмите') + '</div>'
          : '<div class="tile-price">' + item.price + ' ₽</div>');
      tile.addEventListener('click', function(){
        if(mode === 'stock'){ toggleStock(item); }
        else if(!item.soldOut){ addToCart(item.id); }
      });
      el.appendChild(tile);
    });
  }

  async function toggleStock(item){
    try{
      var res = await fetch('/api/items/' + item.id + '/toggle-sold-out', { method:'POST', headers: authHeaders() });
      var data = await res.json();
      if(res.ok){ item.soldOut = data.item.soldOut; renderItemGrid(); }
    }catch(e){}
  }

  document.querySelectorAll('.mode-switch button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.mode-switch button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      mode = btn.getAttribute('data-mode');
      renderItemGrid();
    });
  });

  function addToCart(id){ cart[id] = (cart[id]||0)+1; renderCart(); }
  function changeQty(id, delta){
    cart[id] = (cart[id]||0) + delta;
    if(cart[id] <= 0) delete cart[id];
    renderCart();
  }
  function findItem(id){ return MENU.items.find(function(i){ return i.id === id; }); }
  function cartTotal(){ return Object.keys(cart).reduce(function(s,id){ var it=findItem(id); return s + (it?it.price*cart[id]:0); }, 0); }

  function renderCart(){
    var el = document.getElementById('cartLines');
    var ids = Object.keys(cart);
    if(ids.length === 0){
      el.innerHTML = '<div class="cart-empty">Заказ пуст. Нажимайте на позиции слева.</div>';
    }else{
      el.innerHTML = '';
      ids.forEach(function(id){
        var item = findItem(id);
        if(!item) return;
        var row = document.createElement('div');
        row.className = 'cart-line';
        row.innerHTML =
          '<div class="cl-name">' + item.name + '<div class="cl-price">' + item.price + ' ₽</div></div>' +
          '<div class="qty-ctl"><button class="qty-btn" data-a="dec" data-id="' + id + '">−</button><span class="qty-val">' + cart[id] + '</span><button class="qty-btn" data-a="inc" data-id="' + id + '">+</button></div>';
        el.appendChild(row);
      });
      el.querySelectorAll('.qty-btn').forEach(function(btn){
        btn.addEventListener('click', function(){ changeQty(btn.getAttribute('data-id'), btn.getAttribute('data-a')==='inc'?1:-1); });
      });
    }
    document.getElementById('cartTotal').textContent = cartTotal() + ' ₽';
  }
  renderCart();

  document.getElementById('clearCartBtn').addEventListener('click', function(){
    if(Object.keys(cart).length === 0) return;
    if(confirm('Очистить текущий заказ?')){ cart = {}; renderCart(); }
  });

  var checkoutOverlay = document.getElementById('checkoutOverlay');
  document.getElementById('checkoutBtn').addEventListener('click', function(){
    if(Object.keys(cart).length === 0) return;
    checkoutOverlay.classList.add('open');
  });
  document.getElementById('coCancelBtn').addEventListener('click', function(){ checkoutOverlay.classList.remove('open'); });

  document.getElementById('coConfirmBtn').addEventListener('click', async function(){
    var payload = {
      customerName: document.getElementById('coName').value.trim() || 'Гость у кассы',
      phone: '',
      locationId: locationId,
      comment: document.getElementById('coComment').value.trim(),
      items: Object.keys(cart).map(function(id){ return { id: id, qty: cart[id] }; }),
      source: 'cashier'
    };
    var btn = this;
    btn.disabled = true;
    try{
      var res = await fetch('/api/orders', { method:'POST', headers: authHeaders(), body: JSON.stringify(payload) });
      var data = await res.json();
      if(!res.ok){
        alert(data.error === 'sold_out' ? 'Позиция "' + data.itemName + '" уже отмечена как закончившаяся.' : 'Не получилось оформить заказ.');
        btn.disabled = false;
        return;
      }
      alert('Заказ принят на ' + payload.items.reduce(function(s,i){return s+i.qty;},0) + ' поз., итого ' + data.order.total + ' ₽');
      cart = {};
      renderCart();
      document.getElementById('coName').value = '';
      document.getElementById('coComment').value = '';
      checkoutOverlay.classList.remove('open');
    }catch(e){
      alert('Нет связи с сервером.');
    }
    btn.disabled = false;
  });

  if(token && locationId){ enterPos(); }
})();
</script>
</body>
</html>
